# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libdrm2 \
            libegl1 \
            libgbm1 \
            libgl1 \
            libglvnd0 \
            libglx0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxkbfile1 \
            libxrandr2 \
            libxtst6 \
            libxcb-dri3-0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff==0.15.0 flake8 flake8-pyproject mypy pytest build
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Format check with black
        run: |
          black --check cacao_accounting_desktop
      - name: Lint with ruff
        run: |
          ruff check cacao_accounting_desktop
      - name: Lint with flake8
        run: |
          flake8 cacao_accounting_desktop
      - name: Type check with mypy
        run: |
          mypy cacao_accounting_desktop
      - name: Build package
        run: |
          python -m build
      - name: Run tests
        run: |
          pytest
